{% extends 'base.html' %}

{% block content %}
<h2>Список задач</h2>

<form method="get" class="row mb-4">
  <div class="col-md-4">
    <select name="category" class="form-select">
      <option value="">Все категории</option>
      {% for category in categories %}
        <option value="{{ category.id }}" {% if selected_category == category.id %}selected{% endif %}>
          {{ category.name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <input type="text" name="q" class="form-control" placeholder="Поиск по названию" value="{{ search_query }}">
  </div>
  <div class="col-md-4">
    <button type="submit" class="btn btn-primary">Фильтровать</button>
    <a href="{% url 'tasks:task-list' %}" class="btn btn-secondary">Сброс</a>
  </div>
</form>

<!-- Список задач -->
<ul class="list-group">
  {% for task in tasks %}
    <li class="list-group-item">
      <a href="{% url 'tasks:task-detail' task.pk %}">{{ task.title }}</a>
      <span class="badge bg-secondary float-end">{{ task.category.name }}</span>
    </li>
  {% empty %}
    <li class="list-group-item">Задач не найдено.</li>
  {% endfor %}
</ul>

{% endblock %}
